name: OMEGA Solana onchain keeper observatory
on:
  push:
    branches: [main]
    paths:
      - 'omega/solana-keepers.py'
      - '.github/workflows/omega-solana-keepers.yml'
  schedule:
    - cron: '1-59/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: omega-solana-keepers
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare isolated proof branch
        run: |
          cp omega/solana-keepers.py /tmp/solana-keepers.py
          git fetch origin omega-data
          git checkout -B omega-data origin/omega-data
          cp /tmp/solana-keepers.py omega/solana-keepers.py
      - name: Scan public Solana mainnet signals without wallet
        run: python omega/solana-keepers.py
      - name: Commit only evidence, preserve independent measurements
        run: |
          git config user.name "omega-solana-watch[bot]"
          git config user.email "omega-solana@users.noreply.github.com"
          git add omega/data/solana-keepers.json omega/data/solana-keeper-history.json
          if ! git diff --cached --quiet; then
            git commit -m "omega: observe real Kamino and Velocity flow"
            git fetch origin omega-data
            git rebase origin/omega-data
            git push origin HEAD:omega-data
          fi
