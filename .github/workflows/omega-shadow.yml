name: OMEGA Quant shadow snapshots
on:
  push:
    branches: [main]
    paths:
      - 'omega/scanner.py'
      - 'omega/evm-shadow.cjs'
      - 'omega/bsc-arb.cjs'
      - '.github/workflows/omega-shadow.yml'
  schedule:
    - cron: '3-59/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: omega-quant-snapshot
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout scanner source
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select isolated data branch
        run: |
          cp omega/scanner.py /tmp/omega_main_scanner.py
          cp omega/evm-shadow.cjs /tmp/omega_main_evm.cjs
          cp omega/bsc-arb.cjs /tmp/omega_main_bsc.cjs
          git fetch origin omega-data
          git checkout -B omega-data origin/omega-data
          cp /tmp/omega_main_scanner.py omega/scanner.py
          cp /tmp/omega_main_evm.cjs omega/evm-shadow.cjs
          cp /tmp/omega_main_bsc.cjs omega/bsc-arb.cjs
      - name: Public market snapshot
        run: python omega/scanner.py
      - name: Install EVM read-only dependency
        run: cd omega && npm install --no-audit --no-fund --silent --no-save ethers@6
      - name: Morpho onchain health and profitability ceiling
        run: node omega/evm-shadow.cjs
      - name: BSC atomic reserve math (unfunded price simulation)
        run: node omega/bsc-arb.cjs
      - name: Commit observed data to separate branch
        run: |
          git config user.name "omega-quant-shadow[bot]"
          git config user.email "omega-shadow@users.noreply.github.com"
          git add omega/data/snapshot.json omega/data/history.json omega/data/evm.json omega/data/bsc.json
          if git diff --cached --quiet; then
            echo "No new observations"
          else
            git commit -m "omega: read-only quant snapshot"
            git push origin HEAD:omega-data
          fi
