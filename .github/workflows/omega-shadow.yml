name: OMEGA Quant shadow snapshots
on:
  push:
    branches: [main]
    paths:
      - 'omega/scanner.py'
      - 'omega/evm-shadow.cjs'
      - 'omega/bsc-arb.cjs'
      - 'omega/bsc-v3.cjs'
      - 'omega/keepers.cjs'
      - 'omega/sky.cjs'
      - 'omega/triangles.cjs'
      - '.github/workflows/omega-shadow.yml'
  schedule:
    - cron: '3-59/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: omega-quant-snapshot
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout scanner source
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select isolated data branch
        run: |
          cp omega/scanner.py /tmp/omega_main_scanner.py
          cp omega/evm-shadow.cjs /tmp/omega_main_evm.cjs
          cp omega/bsc-arb.cjs /tmp/omega_main_bsc.cjs
          cp omega/bsc-v3.cjs /tmp/omega_main_bsc_v3.cjs
          cp omega/keepers.cjs /tmp/omega_main_keepers.cjs
          cp omega/sky.cjs /tmp/omega_main_sky.cjs
          cp omega/triangles.cjs /tmp/omega_main_triangles.cjs
          git fetch origin omega-data
          git checkout -B omega-data origin/omega-data
          cp /tmp/omega_main_scanner.py omega/scanner.py
          cp /tmp/omega_main_evm.cjs omega/evm-shadow.cjs
          cp /tmp/omega_main_bsc.cjs omega/bsc-arb.cjs
          cp /tmp/omega_main_bsc_v3.cjs omega/bsc-v3.cjs
          cp /tmp/omega_main_keepers.cjs omega/keepers.cjs
          cp /tmp/omega_main_sky.cjs omega/sky.cjs
          cp /tmp/omega_main_triangles.cjs omega/triangles.cjs
      - name: Public market snapshot
        run: python omega/scanner.py
      - name: Install EVM read-only dependency
        run: cd omega && npm install --no-audit --no-fund --silent --no-save ethers@6
      - name: Morpho onchain health and profitability ceiling
        run: node omega/evm-shadow.cjs
      - name: BSC atomic reserve math (unfunded price simulation)
        run: node omega/bsc-arb.cjs
      - name: Pancake V3 onchain quotes versus V2
        run: node omega/bsc-v3.cjs
      - name: Curve PegKeeper read-only reward checks
        run: node omega/keepers.cjs
      - name: Sky Clipper redo reward checks
        run: node omega/sky.cjs
      - name: Stablecoin closed-loop triangular path tests
        run: node omega/triangles.cjs
      - name: Commit observed data to separate branch
        run: |
          git config user.name "omega-quant-shadow[bot]"
          git config user.email "omega-shadow@users.noreply.github.com"
          git add omega/data/snapshot.json omega/data/history.json omega/data/evm.json omega/data/bsc.json omega/data/bsc-v3.json omega/data/keepers.json omega/data/sky.json omega/data/triangles.json
          if git diff --cached --quiet; then
            echo "No new observations"
          else
            git commit -m "omega: read-only quant snapshot"
            for attempt in 1 2 3; do
              git fetch origin omega-data
              git rebase -X theirs origin/omega-data
              if git push origin HEAD:omega-data; then
                echo "Observation saved on attempt $attempt"
                exit 0
              fi
              sleep 2
            done
            echo "Failed to save after 3 rebase/push attempts"
            exit 1
          fi
