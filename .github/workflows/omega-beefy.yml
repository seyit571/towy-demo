name: OMEGA Beefy exact shadow simulator
on:
  push:
    branches: [main]
    paths:
      - 'omega/beefy-base.cjs'
      - '.github/workflows/omega-beefy.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: omega-beefy-hourly
  cancel-in-progress: false
jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout scanner
        uses: actions/checkout@v4
      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Switch to isolated data branch
        run: |
          cp omega/beefy-base.cjs /tmp/omega-beefy-source.cjs
          git fetch origin omega-data
          git checkout -B omega-data origin/omega-data
          cp /tmp/omega-beefy-source.cjs omega/beefy-base.cjs
      - name: Install read-only dependencies
        run: cd omega && npm install --no-save --no-audit --no-fund ethers@6
      - name: Simulate public harvest operations
        run: node omega/beefy-base.cjs
      - name: Save proof snapshot
        run: |
          git config user.name "omega-beefy-shadow[bot]"
          git config user.email "omega-shadow@users.noreply.github.com"
          git add omega/data/beefy-base.json
          if ! git diff --cached --quiet; then
            git commit -m "omega: exact read-only Beefy payout proof"
            git push origin HEAD:omega-data
          fi
