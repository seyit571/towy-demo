name: OMEGA Equity Basis XYZ x Nasdaq
on:
  push:
    branches: [main]
    paths:
      - 'omega/equity-basis.py'
      - '.github/workflows/omega-equity-basis.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: omega-equity-basis
  cancel-in-progress: false
jobs:
  read_only_basis:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Move to evidence branch
        run: |
          cp omega/equity-basis.py /tmp/omega-equity-basis.py
          git fetch origin omega-data
          git checkout -B omega-data origin/omega-data
          cp /tmp/omega-equity-basis.py omega/equity-basis.py
      - name: Check live XYZ L2 against fresh Nasdaq bid and ask
        run: python omega/equity-basis.py
      - name: Publish latest evidence without recording hypothetical profits as captured
        run: |
          git config user.name "omega-equity-basis[bot]"
          git config user.email "omega-equity-basis@users.noreply.github.com"
          git add omega/data/equity-basis.json
          if git diff --cached --quiet; then
            echo "No update"; exit 0
          fi
          git commit -m "omega: update XYZ and Nasdaq basis entry preflight"
          git reset --hard HEAD
          git clean -f omega/equity-basis.py
          for attempt in 1 2 3; do
            git fetch origin omega-data
            git rebase -X theirs origin/omega-data
            if git push origin HEAD:omega-data; then
              echo "Basis report published"; exit 0
            fi
            sleep 2
          done
          exit 1
